# Docker services for datastore-tests.
# Start all: docker compose up -d --wait
# Then run:  OXIGRAPH_URL=http://localhost:7878 BLAZEGRAPH_URL=http://localhost:9999/bigdata \
#            FUSEKI_URL=http://localhost:3030/ds VIRTUOSO_URL=http://localhost:8890 \
#            AGRAPH_URL=http://localhost:10035/repositories/graviola_ds_test \
#            GRAPHDB_URL=http://localhost:7200/repositories/graviola_ds_test \
#            POSTGRES_URL=postgresql://test:test@localhost:5432/graviola_test \
#            MARIADB_URL=mysql://test:test@localhost:3307/graviola_test \
#            MONGODB_URL='mongodb://test:test@localhost:27017/graviola_test?authSource=admin&directConnection=true&replicaSet=rs0' \
#            bun test
# AllegroGraph (agraph): WebView on http://localhost:10035 — user/password default test/xyzzy (AGRAPH_SUPER_*).
# GraphDB (graphdb): Workbench on http://localhost:7200 — repo created by graphdb-init from graphdb-repo-config.ttl.
# GraphDB 11+ requires a Free license for SPARQL. Place `graphdb.license` beside this compose file; mount is
# `./graphdb.license:/opt/graphdb/home/graphdb.license` with GDB_JAVA_OPTS pointing at that path (avoids work-dir permission issues).
# On the host: `chmod 644 graphdb.license` and optionally `sudo chown 1000:1000 graphdb.license` so the container user can read it.

services:

  # ─── SPARQL stores ──────────────────────────────────────────────────────────

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    platform: linux/amd64
    ports:
      - "7878:7878"
    command: serve --location /data --bind 0.0.0.0:7878
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:7878/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  blazegraph:
    image: lyrasis/blazegraph:2.1.5
    ports:
      - "9999:8080"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget -q --spider http://localhost:8080/bigdata/ || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
    # Blazegraph can be slow to start; give it extra time
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # Apache Jena Fuseki + TDB2 (`ds`). Image supplies the server; `fuseki-assembler.ttl`
  # replaces the default SeCo assembler so the default graph is queryable without GRAPH {}
  # (their stock config sets tdb:unionDefaultGraph true, which hides default-graph triples).
  # SPARQL: http://localhost:3030/ds/sparql — Update: http://localhost:3030/ds/update
  fuseki:
    image: secoresearch/fuseki:5.5.0
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: test
    volumes:
      - fuseki_data:/fuseki-base/databases
      - ./fuseki-assembler.ttl:/fuseki-base/configuration/assembler.ttl:ro
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget -q --spider http://127.0.0.1:3030/$$/ping || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # OpenLink Virtuoso — query: /sparql, authenticated update: /sparql-auth (Digest).
  # Tests pass `default-graph-uri` on every request (VIRTUOSO_DEFAULT_GRAPH, default urn:default).
  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    platform: linux/amd64
    environment:
      DBA_PASSWORD: dba
      VIRT_Parameters_DirsAllowed: "., ../vad, /usr/share/proj"
      VIRT_SPARQL_ResultSetMaxRows: 1000000
      VIRT_SPARQL_MaxQueryCostEstimationTime: 0
      VIRT_SPARQL_MaxQueryExecutionTime: 0
    ports:
      - "8890:8890"
    volumes:
      - virtuoso_data:/database
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "wget -q --spider http://127.0.0.1:8890/sparql || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

  # AllegroGraph 8.5 — SPARQL: http://localhost:10035/repositories/<repo>
  # (see agraph-init; repo `graviola_ds_test` is created for datastore-tests).
  # Session ports 10000–10034 are mapped for AGWebView / sessions (see Franz Docker docs).
  agraph:
    image: franzinc/agraph:v8.5.0
    platform: linux/amd64
    shm_size: 2g
    environment:
      AGRAPH_SUPER_USER: test
      AGRAPH_SUPER_PASSWORD: xyzzy
    ports:
      - "10000-10035:10000-10035"
    # Image has agtool; curl/wget are not guaranteed in PATH.
    healthcheck:
      test:
        [
          "CMD",
          "agtool",
          "catalogs",
          "list",
          "http://test:xyzzy@127.0.0.1:10035",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 45s

  agraph-init:
    image: franzinc/agraph:v8.5.0
    platform: linux/amd64
    depends_on:
      agraph:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        agtool repos create "http://test:xyzzy@agraph:10035/repositories/graviola_ds_test" || true
    restart: "no"

  # Ontotext GraphDB — SPARQL: http://localhost:7200/repositories/<id>
  # Repository `graviola_ds_test` is created via POST /rest/repositories (see graphdb-init).
  # License: mount at graphdb home root (not under work/) so root-owned work/ from the volume does not block reads.
  # GraphDB Free license keys are valid only for a specific 11.x line (e.g. 11.0.x). Pin the image tag to match your key.
  # After changing tags, if the DB was created on another minor version, consider: docker compose down && docker volume rm …_graphdb_data
  graphdb:
    image: ontotext/graphdb:11.0.2
    platform: linux/amd64
    ports:
      - "7200:7200"
    #environment:
    #  GDB_JAVA_OPTS: "-Dgraphdb.license.file=/opt/graphdb/home/graphdb.license"
    volumes:
      - graphdb_data:/opt/graphdb/home
    #  - ./graphdb.license:/opt/graphdb/home/graphdb.license:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:7200/rest/repositories >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s

  graphdb-init:
    image: curlimages/curl:8.11.1
    depends_on:
      graphdb:
        condition: service_healthy
    volumes:
      - ./graphdb-repo-config.ttl:/repo-config.ttl:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        curl -sf -X POST "http://graphdb:7200/rest/repositories" \
          -H "Content-Type: multipart/form-data" \
          -F "config=@/repo-config.ttl" || true
    restart: "no"

  # ─── Relational databases ───────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: graviola_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test", "-d", "graviola_test"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: graviola_test
      MARIADB_USER: test
      MARIADB_PASSWORD: test
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb_data:/var/lib/mysql

  # ─── Document stores ────────────────────────────────────────────────────────
  # MongoDB for Prisma/Mongo tests: official image + single-node replica set `rs0`
  # (Prisma transactions require a replica set). Auth + replSet needs `--keyFile`.
  # The bind-mounted `mongo-keyfile` is copied to /tmp with owner mongodb (999) so
  # Mongo accepts permissions inside the container. Init runs in the healthcheck.

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
      MONGO_INITDB_DATABASE: graviola_test
    ports:
      - "27017:27017"
    entrypoint:
      - bash
      - -c
      - |
        set -e
        cp /keyfile.in /tmp/mongo-rs-keyfile
        chown 999:999 /tmp/mongo-rs-keyfile
        chmod 400 /tmp/mongo-rs-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-rs-keyfile
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "test",
          "-p",
          "test",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "try { rs.status(); } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }); } db.adminCommand('ping').ok",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 25s
    volumes:
      - mongodb_data:/data/db
      - ./mongo-keyfile:/keyfile.in:ro

volumes:
  fuseki_data:
  virtuoso_data:
  graphdb_data:
  postgres_data:
  mariadb_data:
  mongodb_data:
